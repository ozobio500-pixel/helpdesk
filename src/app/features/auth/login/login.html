<div class="page-auth">
  <mat-card class="carte">
    <mat-card-header>
      <mat-card-title>Connexion — Helpdesk</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="envoyer()" class="formulaire">
        <mat-form-field appearance="outline" class="plein">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          @if (form.controls.email.hasError('required')) {
            <mat-error>Email obligatoire</mat-error>
          } @else if (form.controls.email.hasError('email')) {
            <mat-error>Email invalide</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="plein">
          <mat-label>Mot de passe</mat-label>
          <input
            matInput
            type="password"
            formControlName="motDePasse"
            autocomplete="current-password"
          />
          <mat-error>Mot de passe obligatoire (6 car. min.)</mat-error>
        </mat-form-field>

        <button mat-flat-button type="submit" class="plein" [disabled]="enCours()">
          {{ enCours() ? 'Connexion…' : 'Se connecter' }}
        </button>
      </form>

      <p class="lien">
        Pas de compte ?
        <a routerLink="/inscription">S'inscrire</a>
      </p>
      <p class="aide">
        Compte démo admin : <strong>admin@helpdesk.fr</strong> / <strong>Admin123!</strong>
      </p>
    </mat-card-content>
  </mat-card>
</div>
