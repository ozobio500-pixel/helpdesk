@if (auth.estConnecte()) {
  <mat-toolbar color="primary" class="barre">
    <span class="logo">Helpdesk IT</span>
    <span class="spacer"></span>
    <a mat-button routerLink="/tickets">Tickets</a>
    <a mat-button routerLink="/tableau-de-bord">Tableau de bord</a>
    @if (auth.estAdministrateur()) {
      <span class="badge-role admin">Admin</span>
    } @else {
      <span class="badge-role">Demandeur</span>
    }
    <span class="utilisateur">{{ auth.utilisateur()?.nom }}</span>
    <button mat-button type="button" (click)="deconnecter()">Déconnexion</button>
  </mat-toolbar>
}

<main class="contenu">
  <router-outlet></router-outlet>
</main>

<app-toast-container></app-toast-container>
